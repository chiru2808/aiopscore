version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: aiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  aiops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiops-app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      # Database
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      AP_DB_TYPE: postgres

      # Redis
      AP_REDIS_URL: redis://redis:6379

      # Application
      AP_ENVIRONMENT: production
      AP_APP_TITLE: AIOps
      AP_ENCRYPTION_KEY: ${ENCRYPTION_KEY:-$(openssl rand -hex 16)}
      AP_JWT_SECRET: ${JWT_SECRET:-$(openssl rand -hex 32)}
      AP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

      # Optional: SMTP
      AP_SMTP_HOST: ${SMTP_HOST:-}
      AP_SMTP_PORT: ${SMTP_PORT:-587}
      AP_SMTP_USER: ${SMTP_USER:-}
      AP_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AP_SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
