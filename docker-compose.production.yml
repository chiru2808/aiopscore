version: "3.8"

services:
  # --------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17.2
    container_name: aiops_postgres
    restart: always
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AP_POSTGRES_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # --------------------------------------------------------------------------
  # Cache Service (Redis)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aiops_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # AIOps Core Service
  # --------------------------------------------------------------------------
  aiops:
    # Use the official image or your custom built one
    image: activepieces/activepieces:latest
    container_name: aiops_platform
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "80:80"
    env_file: .env
    environment:
      - AP_SMTP_HOST=${AP_SMTP_HOST}
      - AP_SMTP_PORT=${AP_SMTP_PORT}
      - AP_SMTP_USERNAME=${AP_SMTP_USERNAME}
      - AP_SMTP_PASSWORD=${AP_SMTP_PASSWORD}
      - AP_SMTP_SENDER_EMAIL=${AP_SMTP_SENDER_EMAIL}
      - AP_SMTP_USE_SSL=${AP_SMTP_USE_SSL}
    volumes:
      - aiops_data:/data
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  aiops_data:
